<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>和弦进行生成器 · Chord Progression Generator</title>
<style>
/*CSS*/
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo" aria-hidden="true">♪</div><h1>和弦进行生成器<small>符合乐理 · 133 种风格</small></h1></div>
  <div class="tabs" role="tablist" aria-label="模式">
    <button role="tab" id="tabRand" aria-selected="true">随机生成</button>
    <button role="tab" id="tabSeed" aria-selected="false">根据和弦扩展</button>
  </div>
  <div class="hbtns">
    <button class="ib" id="undo" data-tip="撤销 (Ctrl+Z)" aria-label="撤销" disabled>↶</button>
    <button class="ib" id="redo" data-tip="重做 (Ctrl+Shift+Z)" aria-label="重做" disabled>↷</button>
    <button class="ib" id="histBtn" data-tip="历史记录 (H)" aria-label="历史记录">🕘<span class="lbl">历史</span></button>
    <button class="ib" id="favBtn" data-tip="收藏夹 (F)" aria-label="收藏夹">★<span class="lbl">收藏</span></button>
    <button class="ib" id="theme" data-tip="切换深色/浅色 (T)" aria-label="切换主题">◐</button>
    <button class="ib" id="help" data-tip="快捷键 (?)" aria-label="快捷键">⌨</button>
  </div>
</header>
<main id="main">
  <section class="card panel" id="ctrl" aria-label="生成参数">
    <div class="panel-head"><h2>生成参数</h2><button class="ib only-m" data-close-ctrl aria-label="关闭参数">✕</button></div>
    <div class="group" id="seedBox" hidden>
      <label class="f">种子和弦 <span class="hint-i">空格 / 逗号 / ｜ / - 分隔，如 <code>Am F C G</code>、<code>Dm7</code>、<code>C/E</code></span>
        <input type="text" id="seeds" value="Am F C G" placeholder="Am F C G" autocomplete="off" spellcheck="false" aria-describedby="seedErr">
      </label>
      <div class="row wrap" id="inferBox"></div>
      <div class="err" id="seedErr" role="alert"></div>
      <div class="grid">
        <label class="f">歌曲长度<select id="songLen"><option>短</option><option selected>标准</option><option>长</option></select></label>
        <label class="f">转调<select id="modulate"><option value="1">最后副歌 +全音</option><option value="0">不转调</option></select></label>
      </div>
    </div>
    <div class="group">
      <div class="f picker" id="picker"><span class="flab">风格</span>
        <button class="pickbtn" id="pickBtn" aria-haspopup="listbox" aria-expanded="false"><span id="pickLabel">🎲 全部随机</span><span aria-hidden="true">▾</span></button>
        <div class="pop" id="pickPop"><input type="search" id="pickSearch" placeholder="搜索风格：jazz / 国风 / lo-fi…" aria-label="搜索风格"><div class="plist" id="pickList" role="listbox"></div></div>
      </div>
      <div class="grid">
        <label class="f">情绪<select id="mood"></select></label>
        <label class="f"><span id="barsLabel">小节数</span><select id="bars"></select></label>
        <label class="f">调性<select id="key"></select></label>
        <label class="f">调式<select id="mode"></select></label>
      </div>
    </div>
    <details class="group adv" id="adv">
      <summary>高级设置 <span class="hint-i">拍号、速度、复杂度、和声节奏</span></summary>
      <div class="grid">
        <label class="f">拍号<select id="meter"></select></label>
        <label class="f">速度感<select id="feel"><option value="rand">🎲 随机</option><option>快</option><option>中</option><option>慢</option></select></label>
        <label class="f full"><span>速度 BPM <b id="bpmVal"></b></span>
          <span class="row"><input type="number" id="bpm" class="bpmin wide" min="20" max="300" step="1" value="100" inputmode="numeric" aria-label="速度 BPM（20–300）"><button class="chip on" id="bpmRand" type="button" aria-pressed="true">🎲 随机</button></span>
        </label>
        <label class="f"><span><span class="term" data-tip="每小节放几个和弦。数字越大和弦变化越快。">和声节奏</span></span><select id="hr"></select></label>
        <label class="f"><span><span class="term" data-tip="三和弦最朴素；七和弦更丰富；九/十一/十三增加延伸音；变化和弦在属和弦上加入 ♭9、♯9、♯11、♭13 等张力。">复杂度</span></span><select id="complexity"></select></label>
      </div>
    </details>
    <div class="panel-foot">
      <button class="ib big wide" id="allRand" data-tip="所有参数设为随机并生成 (A)">🎲 全部随机</button>
      <button class="ib pri big wide only-m" id="genM">✨ 生成</button>
    </div>
  </section>

  <section class="workspace" aria-label="结果">
    <div class="transport card" id="transport" role="toolbar" aria-label="播放与操作">
      <button class="playbtn" id="play" aria-label="播放 (空格)" data-tip="播放 / 停止 (空格)"><span id="playIcon">▶</span></button>
      <button class="ib dsk" id="stop" aria-label="停止" disabled>■</button>
      <div class="prog" aria-hidden="true"><div class="prog-bar"><i id="progFill"></i></div><span class="prog-t" id="progT">0:00 / 0:00</span></div>
      <div class="stepper" role="group" aria-label="速度"><input type="number" id="bpmNow" class="bpmin" min="20" max="300" step="1" inputmode="numeric" aria-label="速度 BPM（20–300，回车确认）" data-tip="输入 BPM（20–300），回车/失焦生效；↑↓ 或滚轮微调，Shift ±10"><span class="u">BPM</span><button class="ib sm" id="tap" aria-label="点按测速" data-tip="连续点按测速 Tap tempo">TAP</button></div>
      <div class="menu"><button class="ib" id="soundBtn" aria-haspopup="true" aria-expanded="false" data-tip="循环 / 节拍器 / 鼓 / 旋律 / 音色">🎚<span class="lbl">声音</span></button>
        <div class="pop sheet" id="soundPop">
          <div class="pop-title">播放</div>
          <div class="chips"><button class="chip" id="loop" aria-pressed="false">🔁 循环</button><button class="chip" id="metro" aria-pressed="false">🥁 节拍器</button><button class="chip on" id="drums" aria-pressed="true">🪘 鼓组</button><button class="chip" id="melody" aria-pressed="false">🎵 旋律提示</button></div>
          <div class="pop-title">音色 <span class="hint-i" id="sfStatus" role="status"></span></div>
          <label class="f">音源<select id="inst"><option value="gm">🎼 GM 采样音色（FluidR3，在线加载）</option><optgroup label="内置合成器（离线）"><option value="piano">🎹 合成钢琴</option><option value="epiano">🎛 合成电钢琴</option><option value="pad">🌫 合成铺底</option><option value="guitar">🎸 合成吉他扫弦</option></optgroup></select></label>
          <label class="f">和弦音色<select id="progChord" class="gmsel"></select></label>
          <label class="f">低音音色<select id="progBass" class="gmsel"></select></label>
          <label class="f">旋律音色<select id="progMelody" class="gmsel"></select></label>
          <label class="f">鼓组<select id="drumKit"><option value="gm">🥁 GM 标准鼓组（采样）</option><option value="synth">内置合成鼓</option></select></label>
          <div class="chips"><button class="chip" id="progDefault" type="button">↺ 按风格推荐音色</button></div>
          <label class="f">伴奏节奏型<select id="pattern"></select></label>
        </div>
      </div>
      <div class="keygrp dsk" role="group" aria-label="移调"><button class="ib sm" id="tDown" data-tip="降半音 ([)" aria-label="降半音">♭</button><span class="num" id="keyNow">—</span><button class="ib sm" id="tUp" data-tip="升半音 (])" aria-label="升半音">♯</button></div>
      <span class="grow"></span>
      <button class="ib only-m" id="openCtrl" aria-label="打开参数">⚙<span class="lbl">参数</span></button>
      <button class="ib dsk" id="regen" data-tip="重新生成未锁定的和弦 (R)">↻<span class="lbl">重生成</span></button>
      <button class="ib pri" id="gen" data-tip="按当前参数生成 (Enter)">✨<span class="lbl">生成</span></button>
      <div class="menu"><button class="ib" id="expBtn" aria-haspopup="menu" aria-expanded="false">⬇<span class="lbl">导出</span></button>
        <div class="pop sheet right" id="expPop" role="menu">
          <div class="pop-title">MIDI</div>
          <button id="midi" role="menuitem">🎼 多轨 MIDI（全曲）</button>
          <button id="zipAll" role="menuitem">📦 全部分轨打包 .zip</button>
          <div class="pop-row"><button data-part="chord" role="menuitem">和弦</button><button data-part="bass" role="menuitem">低音</button><button data-part="melody" role="menuitem">旋律</button><button data-part="drum" role="menuitem">鼓</button></div>
          <div class="pop-title">其他</div>
          <button id="png" role="menuitem">🖼 PNG 和弦谱</button><button id="txt" role="menuitem">📄 文本文件</button><button id="copy" role="menuitem">📋 复制文本</button>
          <div class="pop-title">保存</div>
          <button id="save" role="menuitem">☆ 收藏当前进行 (S)</button><button id="share" role="menuitem">🔗 复制分享链接</button>
        </div>
      </div>
    </div>
    <div class="card" id="out" aria-live="polite"><div id="onboard"></div><div id="result"><div class="empty">正在生成…</div></div></div>
  </section>

  <aside class="card panel" id="insp" aria-label="和弦详情"></aside>
</main>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="favDrawer" aria-label="收藏夹"><h2>★ 收藏夹 <button class="ib" data-close>✕</button></h2><div id="favList"></div></div>
<div class="drawer" id="histDrawer" aria-label="历史"><h2>🕘 历史记录 <button class="ib" data-close>✕</button></h2><div id="histList"></div></div>
<div class="drawer" id="helpDrawer" aria-label="快捷键"><h2>⌨ 快捷键 <button class="ib" data-close>✕</button></h2>
  <div class="keys"><kbd>Space</kbd><span>播放 / 停止</span><kbd>Enter</kbd><span>按参数生成</span><kbd>R</kbd><span>重新生成未锁定和弦</span><kbd>A</kbd><span>全部随机</span><kbd>← →</kbd><span>选择上/下一个和弦</span><kbd>L</kbd><span>锁定/解锁选中和弦</span><kbd>[ ]</kbd><span>移调 −1 / +1 半音</span><kbd>Ctrl+Z</kbd><span>撤销</span><kbd>Ctrl+Shift+Z</kbd><span>重做</span><kbd>+ −</kbd><span>速度 ±2 BPM（按住 Shift 点按钮 ±10）</span><kbd>M</kbd><span>节拍器</span><kbd>D</kbd><span>鼓组</span><kbd>S</kbd><span>收藏</span><kbd>T</kbd><span>切换主题</span><kbd>Esc</kbd><span>关闭面板</span></div>
  <p class="hint">术语下方带虚线的文字悬停可看解释。</p>
</div>
<div id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status"></div>
<script>
/*ENGINE*/
</script>
<script>
/*UI*/
</script>
</body>
</html>
