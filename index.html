<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>和弦进行生成器 · Chord Progression Generator</title>
<style>
:root{--bg:#0d1020;--bg2:#121631;--panel:#161a33;--panel2:#1d2244;--line:#2a3060;--text:#eceefb;--muted:#a3a9cf;--faint:#6d74a3;--acc:#8b93ff;--acc2:#ff6fae;--accT:#fff;--T:#34d399;--S:#60a5fa;--D:#fb923c;--X:#c084fc;--shadow:0 12px 32px #0006;--r:16px;--glass:rgba(22,26,51,.82)}
[data-theme=light]{--bg:#f3f4fb;--bg2:#e9ebf8;--panel:#ffffff;--panel2:#f2f3fb;--line:#dcdff0;--text:#1b1e33;--muted:#545a7d;--faint:#8a90b0;--acc:#5b5ff0;--acc2:#e0457f;--T:#059669;--S:#2563eb;--D:#ea580c;--X:#9333ea;--shadow:0 10px 28px #2a2f6b1f;--glass:rgba(255,255,255,.85)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;min-height:100vh;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 0% -10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%),radial-gradient(800px 500px at 100% 0%,color-mix(in srgb,var(--acc2) 16%,transparent),transparent 70%);z-index:-1}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
code{background:var(--panel2);border:1px solid var(--line);padding:0 5px;border-radius:6px;font-size:12px}
/* header */
header{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between;padding:12px 22px;background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:19px;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 45%,transparent)}
h1{margin:0;font-size:18px;letter-spacing:.3px}
h1 small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.tabs{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 15px;border-radius:999px;cursor:pointer;transition:all .2s}
.tabs button[aria-selected=true]{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 40%,transparent)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:10px;height:34px;min-width:34px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .15s;color:var(--text)}
.ib:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.ib:disabled{opacity:.4;cursor:default}
.ib.on{background:color-mix(in srgb,var(--acc) 18%,var(--panel));border-color:var(--acc);color:var(--text)}
.ib.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;font-weight:600;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.ib.big{height:40px;padding:0 16px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 4px;color:var(--muted);background:var(--panel2)}
/* layout */
main{display:grid;grid-template-columns:330px minmax(0,1fr) 320px;gap:16px;padding:16px 22px 60px;max-width:1680px;margin:0 auto;align-items:start}
@media(max-width:1280px){main{grid-template-columns:320px minmax(0,1fr)}#insp{grid-column:1/-1}}
@media(max-width:880px){main{grid-template-columns:1fr;padding:10px 10px 80px}header{padding:10px 12px}h1 small{display:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.sticky{position:sticky;top:76px}
@media(max-width:1280px){.sticky{position:static}}
.card h2{font-size:13px;letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px;color:var(--muted);display:flex;align-items:center;gap:8px}
.group{padding:12px 0;border-top:1px dashed var(--line)}
.group:first-of-type{border-top:0;padding-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=search]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;transition:border .15s;color:var(--text)}
select:focus,input:focus{border-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
.row{display:flex;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--acc)}
.chip.on{color:var(--text);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 20%,var(--panel2))}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.hint{font-size:12px;color:var(--faint);margin:10px 0 0}
.err{color:#f87171;font-size:12px;min-height:1em;margin-top:4px}
/* style picker */
.picker{position:relative}
.pickbtn{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.pickbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop{position:absolute;z-index:40;left:0;right:-40px;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:none;animation:pop .14s ease-out}
.pop.open{display:block}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.plist{max-height:340px;overflow:auto;margin-top:6px}
.plist .gh{position:sticky;top:0;background:var(--panel);font-size:11.5px;color:var(--acc);padding:6px 6px 3px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
.plist .it{padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.plist .it:hover,.plist .it.sel{background:var(--panel2)}
.plist .it.sel{color:var(--acc)}
/* result */
.transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.transport .sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.transport select{width:auto;padding:6px 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.tag b{color:var(--text);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.section{margin:16px 0 4px;animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.sh h3{margin:0;font-size:15px}
.sh .k{font-size:12px;color:var(--muted)}
.sh .mod{font-size:12px;color:var(--acc2);font-weight:600}
.sh .sp{flex:1}
.sh .ib{height:28px;font-size:12px;padding:0 8px}
.note{margin:0 0 8px;color:var(--muted);font-size:12.5px}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:640px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:5px;display:flex;gap:5px;min-height:92px;position:relative}
.bar .no{position:absolute;top:3px;left:8px;font-size:10px;color:var(--faint)}
.ch{flex:1;min-width:0;border-radius:10px;padding:18px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--panel);border:1px solid transparent;border-top:3px solid var(--X);cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s;position:relative;animation:fade .3s ease-out both}
.ch:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0003}
.ch.T{border-top-color:var(--T)}.ch.S{border-top-color:var(--S)}.ch.D{border-top-color:var(--D)}
.ch .nm{font-size:17px;font-weight:700;word-break:break-word;line-height:1.2}
.ch .rn{font-size:12.5px;color:var(--muted);font-family:"Times New Roman",Georgia,serif}
.ch .fn{font-size:10.5px;color:var(--faint)}
.ch .tg{font-size:10.5px;color:var(--acc2);font-weight:600}
.ch.cont{opacity:.5}
.ch.sel{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 45%,transparent)}
.ch.now{background:color-mix(in srgb,var(--acc) 25%,var(--panel));box-shadow:0 0 0 2px var(--acc),0 0 24px color-mix(in srgb,var(--acc) 50%,transparent);transform:scale(1.03)}
.ch.locked{background:repeating-linear-gradient(135deg,var(--panel),var(--panel) 8px,color-mix(in srgb,var(--acc) 8%,var(--panel)) 8px,color-mix(in srgb,var(--acc) 8%,var(--panel)) 16px)}
.lk{position:absolute;top:2px;right:3px;border:0;background:transparent;cursor:pointer;font-size:12px;opacity:.35;padding:2px;border-radius:6px}
.ch:hover .lk,.lk.on{opacity:1}
.ex{margin:10px 0 0;padding-left:18px;color:var(--muted)}
.ex li{margin:5px 0}
.term{border-bottom:1px dotted var(--acc);cursor:help;color:var(--text)}
.empty{color:var(--muted);text-align:center;padding:60px 0}
/* inspector */
.cbig{font-size:30px;font-weight:800;line-height:1.1}
.sub{color:var(--muted);font-family:"Times New Roman",Georgia,serif;font-size:16px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.badge{font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--panel2)}
.badge.T{color:var(--T)}.badge.S{color:var(--S)}.badge.D{color:var(--D)}.badge.x{color:var(--acc2)}
.viz{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0;overflow:hidden}
.viz svg{display:block;width:100%;height:auto}
.alts{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-height:420px;overflow:auto}
.altg{font-size:11.5px;color:var(--muted);margin:6px 0 2px}
.alt{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 10px;cursor:pointer;transition:all .15s;text-align:left;width:100%}
.alt:hover{border-color:var(--acc);transform:translateX(2px)}
.alt b{font-size:14px}
.alt small{color:var(--muted);font-family:"Times New Roman",serif}
/* drawers */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;transform:translateX(105%);transition:transform .25s ease;padding:16px;overflow:auto}
.drawer.open{transform:none}
.drawer h2{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--panel2)}
.li .t{flex:1;min-width:0;cursor:pointer}
.li .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t small{color:var(--muted)}
.li.cur{border-color:var(--acc)}
.scrim{position:fixed;inset:0;background:#0006;z-index:45;display:none}
.scrim.open{display:block}
#tip{position:fixed;z-index:60;max-width:280px;background:var(--text);color:var(--bg);font-size:12px;padding:7px 10px;border-radius:9px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:var(--shadow)}
#tip.on{opacity:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:999px;opacity:0;transition:all .2s;pointer-events:none;z-index:70;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.menu{position:relative}
.menu .pop{right:0;left:auto;min-width:200px}
.menu .pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text)}
.menu .pop button:hover{background:var(--panel2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo" aria-hidden="true">♪</div><h1>和弦进行生成器<small>符合乐理 · 133 种风格 · v2</small></h1></div>
  <div class="tabs" role="tablist" aria-label="模式">
    <button role="tab" id="tabRand" aria-selected="true">随机生成</button>
    <button role="tab" id="tabSeed" aria-selected="false">根据给定和弦扩展</button>
  </div>
  <div class="hbtns">
    <button class="ib" id="undo" data-tip="撤销 (Ctrl+Z)" aria-label="撤销" disabled>↶</button>
    <button class="ib" id="redo" data-tip="重做 (Ctrl+Shift+Z)" aria-label="重做" disabled>↷</button>
    <button class="ib" id="histBtn" data-tip="历史记录 (H)">🕘 历史</button>
    <button class="ib" id="favBtn" data-tip="收藏夹 (F)">★ 收藏</button>
    <button class="ib" id="theme" data-tip="切换深色/浅色主题" aria-label="切换主题">◐</button>
    <button class="ib" id="help" data-tip="快捷键 (?)" aria-label="快捷键">⌨</button>
  </div>
</header>
<main>
  <section class="card sticky" id="ctrl" aria-label="参数">
    <div class="group" id="seedBox" hidden>
      <h2>种子和弦</h2>
      <label class="f">输入一个或多个和弦，支持空格、逗号、｜、- 分隔，如 <code>Am F C G</code>、<code>Dm7</code>、<code>C/E</code>
        <input type="text" id="seeds" value="Am F C G" placeholder="Am F C G" autocomplete="off" spellcheck="false">
      </label>
      <div class="row" id="inferBox" style="flex-wrap:wrap;margin-top:6px"></div>
      <div class="err" id="seedErr" role="alert"></div>
      <div class="grid">
        <label class="f">歌曲长度<select id="songLen"><option>短</option><option selected>标准</option><option>长</option></select></label>
        <label class="f">转调<select id="modulate"><option value="1">最后副歌 +全音</option><option value="0">不转调</option></select></label>
      </div>
    </div>
    <div class="group">
      <h2>风格与情绪</h2>
      <div class="grid">
        <div class="f full picker" id="picker"><span style="font-size:12px;color:var(--muted)">风格（可搜索）</span>
          <button class="pickbtn" id="pickBtn" aria-haspopup="listbox"><span id="pickLabel">🎲 全部随机</span><span>▾</span></button>
          <div class="pop" id="pickPop"><input type="search" id="pickSearch" placeholder="搜索风格，如 jazz / 国风 / lo-fi"><div class="plist" id="pickList" role="listbox"></div></div>
        </div>
        <label class="f full">情绪<select id="mood"></select></label>
      </div>
    </div>
    <div class="group">
      <h2>调性与节拍</h2>
      <div class="grid">
        <label class="f">调性<select id="key"></select></label>
        <label class="f">调式<select id="mode"></select></label>
        <label class="f">拍号<select id="meter"></select></label>
        <label class="f">速度感<select id="feel"><option value="rand">🎲 随机</option><option>快</option><option>中</option><option>慢</option></select></label>
        <label class="f full"><span>速度 BPM <b id="bpmVal"></b></span>
          <span class="row"><input type="range" id="bpm" min="40" max="220" value="100" aria-label="BPM"><button class="chip on" id="bpmRand" type="button">🎲 随机</button></span>
        </label>
      </div>
    </div>
    <div class="group">
      <h2>结构与和声</h2>
      <div class="grid">
        <label class="f"><span id="barsLabel">小节数</span><select id="bars"></select></label>
        <label class="f"><span><span class="term" data-tip="每小节放几个和弦。数字越大和弦变化越快。">和声节奏</span></span><select id="hr"></select></label>
        <label class="f full"><span><span class="term" data-tip="三和弦最朴素；七和弦更丰富；九/十一/十三增加延伸音；变化和弦在属和弦上加入 ♭9、♯9、♯11、♭13 等张力。">和弦复杂度</span></span><select id="complexity"></select></label>
      </div>
    </div>
    <div class="actions">
      <button class="ib pri big" id="gen" data-tip="按当前参数生成新进行 (Enter)">✨ 生成</button>
      <button class="ib big" id="allRand" data-tip="所有参数设为随机并生成 (A)">🎲 全部随机</button>
    </div>
    <p class="hint">点击和弦可试听并查看替换；🔒 锁定后按 <kbd>R</kbd> 只重新生成未锁定部分。</p>
  </section>

  <section class="card" id="out" aria-live="polite">
    <div class="transport" id="transport">
      <button class="ib pri" id="play" aria-label="播放">▶ 播放</button>
      <button class="ib" id="stop" aria-label="停止" disabled>■</button>
      <button class="chip" id="loop" aria-pressed="false" data-tip="循环播放">🔁 循环</button>
      <button class="chip" id="metro" aria-pressed="false" data-tip="节拍器 (M)">🥁 节拍器</button>
      <button class="chip on" id="drums" aria-pressed="true" data-tip="按风格生成的简易鼓组 (D)">🪘 鼓</button>
      <button class="chip" id="melody" aria-pressed="false" data-tip="基于和弦音与调内音生成旋律提示">🎵 旋律提示</button>
      <span class="sep"></span>
      <select id="inst" aria-label="音色" data-tip="和弦音色"><option value="piano">🎹 钢琴</option><option value="epiano">🎛 电钢琴</option><option value="pad">🌫 合成铺底</option><option value="guitar">🎸 吉他扫弦</option></select>
      <select id="pattern" aria-label="伴奏节奏型"></select>
      <span class="sep"></span>
      <button class="ib" id="tDown" data-tip="降半音移调 ([)">♭</button><span class="tag" id="keyNow">—</span><button class="ib" id="tUp" data-tip="升半音移调 (])">♯</button>
      <span style="flex:1"></span>
      <button class="ib" id="regen" data-tip="重新生成未锁定的和弦 (R)">↻ 重生成</button>
      <button class="ib" id="save" data-tip="收藏当前进行 (S)">☆</button>
      <div class="menu"><button class="ib" id="expBtn" aria-haspopup="menu">⬇ 导出 ▾</button>
        <div class="pop" id="expPop" role="menu">
          <button id="midi">🎼 MIDI（全曲）</button><button id="png">🖼 PNG 和弦谱</button><button id="txt">📄 文本文件</button><button id="copy">📋 复制文本</button><button id="share">🔗 复制分享链接</button>
        </div>
      </div>
    </div>
    <div id="result"><div class="empty">点击「生成」开始</div></div>
  </section>

  <aside class="card sticky" id="insp" aria-label="和弦详情"><div class="empty">选择一个和弦查看详情</div></aside>
</main>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="favDrawer" aria-label="收藏夹"><h2>★ 收藏夹 <button class="ib" data-close>✕</button></h2><div id="favList"></div></div>

  const tip = $('tip');
  const GLOSS = {
    主功能: '主功能 (T)：稳定、有归属感的和弦，如 I、vi、iii。', 下属功能: '下属功能 (S)：离开主和弦、准备属和弦，如 IV、ii。', 属功能: '属功能 (D)：紧张、强烈倾向回到主和弦，如 V、vii°。',
    借用: '借用和弦：从同主音的平行调式（如 C 大调借 C 小调）借来的和弦，带来明暗变化。', 副属: '副属和弦：调内某和弦的属和弦（V/x），让它临时成为“主”，增强推动力。',
    三全音替代: '三全音替代：用根音相距三全音的属七代替原属七，二者共享 3、7 音，低音半音下行解决。', 调式特征: '调式特征和弦：包含该调式标志性音的和弦，如多利亚的 IV、混合利底亚的 ♭VII。',
    和声小调属: '和声小调属：小调中把 v 升高三音成为大三/属七 V，形成导音，强化终止。', 转调属: '转调属：新调的属七和弦，用来自然地引入新调。', 转位: '转位：低音不是根音的和弦（斜线和弦），让低音线更平滑。',
    正格终止: '正格终止：V → I，最强烈、最完满的结束感。', 变格终止: '变格终止：IV → I，“阿们终止”，柔和。', 半终止: '半终止：停在 V 上，像逗号，等待继续。', 调式终止: '调式终止：用调式特征和弦回到主和弦，不经过 V。',
    王道进行: '王道进行：IV–V–iii–vi，日本流行最常见的进行。', 卡农进行: '卡农进行：I–V–vi–iii–IV–I–IV–V，源自帕赫贝尔《卡农》。', 安达卢西亚: '安达卢西亚终止：i–♭VII–♭VI–V 下行，弗拉门戈标志。', 五度圈: '五度圈：根音按纯四/纯五度循环运动（如 vi–ii–V–I），最自然的和声推进。',

  };
  const termify = (html) => html.replace(new RegExp(Object.keys(GLOSS).join('|'), 'g'), (m) => `<span class="term" data-tip="${esc(GLOSS[m])}">${m}</span>`);
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest('[data-tip]');

    let x = Math.min(innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2)), y = r.top - h - 8;

  $('pattern').innerHTML = '<option value="style">节奏型：随风格</option>' + Object.entries(E.PATTERNS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');

  /* ---------- 风格选择器 ---------- */

  /* ---------- 历史 / 撤销 ---------- */
  let hist = [], hp = -1;
  function commit(label) {
    if (!song) return;
    hist = hist.slice(0, hp + 1);
    hist.push({ label, time: Date.now(), data: JSON.stringify(E.serialize(song)) });
    if (hist.length > 60) hist.shift();
    hp = hist.length - 1; syncHist();
  }
  function restore(i) {
    if (i < 0 || i >= hist.length) return;
    hp = i; song = E.deserialize(JSON.parse(hist[i].data)); sel = Math.min(sel, song.flat.length - 1);
    stop(); render(); syncHist();
  }
  function syncHist() {
    $('undo').disabled = hp <= 0; $('redo').disabled = hp >= hist.length - 1;
    $('histList').innerHTML = hist.map((h, i) => ({ h, i })).reverse().map(({ h, i }) => `<div class="li${i === hp ? ' cur' : ''}"><div class="t" data-i="${i}"><div>${esc(h.label)}</div><small>${new Date(h.time).toLocaleTimeString()}</small></div></div>`).join('') || '<p class="hint">暂无</p>';
  }
  $('histList').onclick = (e) => { const t = e.target.closest('[data-i]'); if (t) restore(+t.dataset.i); };
  $('undo').onclick = () => restore(hp - 1);

  /* ---------- 生成 ---------- */
  function opts() {
    const o = { genre: state.genre, style: state.style, mood: $('mood').value, meter: $('meter').value, key: $('key').value, mode: $('mode').value, bars: $('bars').value, complexity: $('complexity').value, hr: $('hr').value, feel: $('feel').value, bpm: bpmRand ? 'rand' : $('bpm').value };
    if (mode === 'seed') Object.assign(o, { seeds: $('seeds').value, length: $('songLen').value, modulate: $('modulate').value === '1' });
    return o;
  }
  function generate() {
    stop();
    try { song = mode === 'seed' ? E.expand(opts()) : E.generate(opts()); $('seedErr').textContent = ''; } catch (e) { $('seedErr').textContent = e.message; toast(e.message); return; }
    sel = -1; afterNew('生成：' + song.settings.style + ' · ' + song.settings.key);
  }
  function afterNew(label) {
    if (bpmRand) $('bpm').value = song.bpm;
    syncBpm(); render(); commit(label);
  }
  function regen(section) {
    if (!song) return generate();
    stop(); E.regenerate(song, { section }); render();
    commit(section === undefined ? '重新生成（保留锁定）' : '重新生成：' + song.sections[section].name);

  /* ---------- 渲染 ---------- */
  const FN = { T: '主 T', S: '下属 S', D: '属 D' };
  function renderTags() {
    const s = song.settings;
    $('keyNow').textContent = s.key + ' ' + (E.MODES[s.mode].n.split(' ')[0]);
    const t = document.getElementById('tagline'); if (!t) return;
    t.innerHTML = [['风格', s.genre.split(' ')[0] + ' › ' + s.style], ['情绪', s.mood], ['调', s.key + ' ' + s.modeName], ['拍号', s.meter], ['速度', song.bpm + ' BPM'], ['复杂度', s.complexityName], ['和声节奏', s.hr + '/小节']].map(([k, v]) => `<span class="tag">${k} <b>${esc(v)}</b></span>`).join('');
  }
  function render() {
    let h = '<div class="tags" id="tagline"></div><div class="legend"><span><i style="background:var(--T)"></i><span class="term" data-tip="' + esc(GLOSS.主功能) + '">主功能 T</span></span><span><i style="background:var(--S)"></i><span class="term" data-tip="' + esc(GLOSS.下属功能) + '">下属 S</span></span><span><i style="background:var(--D)"></i><span class="term" data-tip="' + esc(GLOSS.属功能) + '">属 D</span></span><span style="color:var(--acc2)">粉字 = 借用 / 副属 / 替代 / 转调</span></div>';

    song.sections.forEach((sec, si) => {
      h += `<div class="section" style="animation-delay:${si * 40}ms"><div class="sh"><h3>${esc(sec.name)}</h3><span class="k">${esc(sec.keyLabel)}</span>${sec.modulated ? '<span class="mod">⤴ 转调 +全音</span>' : ''}<span class="sp"></span>
        <button class="ib" data-act="playsec" data-si="${si}" data-tip="只播放本段">▶</button><button class="ib" data-act="regensec" data-si="${si}" data-tip="重新生成本段（保留锁定）">↻</button><button class="ib" data-act="midisec" data-si="${si}" data-tip="导出本段 MIDI">⬇ MIDI</button></div>${sec.note ? `<p class="note">${termify(esc(sec.note))}</p>` : ''}<div class="bars">`;
      for (const bar of sec.bars) {
        h += `<div class="bar"><span class="no">${barNo++}</span>`;
        for (const cell of bar) {
          const c = song.flat[cell.ci];
          if (cell.cont) h += `<div class="ch cont ${c.func}" data-ci="${cell.ci}" data-cont="1"><div class="nm">%</div><div class="fn">延续 ${esc(c.name)}</div></div>`;
          else h += `<div class="ch ${c.func}${c.lock ? ' locked' : ''}${cell.ci === sel ? ' sel' : ''}" data-ci="${cell.ci}" style="flex:${cell.dur};animation-delay:${Math.min(cell.ci * 12, 400)}ms" tabindex="0" role="button" aria-label="${esc(c.name)} ${esc(c.roman)}">
            <button class="lk${c.lock ? ' on' : ''}" data-lock="${cell.ci}" aria-label="锁定" data-tip="${c.lock ? '已锁定：重新生成时保留' : '锁定此和弦'}">${c.lock ? '🔒' : '🔓'}</button>
            <div class="nm">${esc(c.name)}</div><div class="rn">${esc(c.roman)}</div><div class="fn">${FN[c.func] || esc(c.func)}</div>${c.tag ? `<div class="tg" data-tip="${esc(GLOSS[c.tag] || c.tag)}">${esc(c.tag)}</div>` : ''}</div>`;

  /* ---------- 可视化：钢琴与吉他 ---------- */
  function pianoSVG(c) {
    const lo = 36, hi = 84, white = [], black = [], on = new Set(c.upper), bass = c.bassNote;
    const isB = (n) => [1, 3, 6, 8, 10].includes(n % 12);
    let x = 0; const W = 12;
    for (let n = lo; n <= hi; n++) { if (!isB(n)) { white.push({ n, x }); x += W; } else black.push({ n, x: x - 4 }); }
    const col = (n) => (n === bass ? 'var(--D)' : on.has(n) ? 'var(--acc)' : null);
    let s = `<svg viewBox="0 0 ${x} 60" role="img" aria-label="钢琴键盘：${esc(c.name)}">`;
    for (const k of white) s += `<rect x="${k.x}" y="0" width="${W - 1}" height="58" rx="2" fill="${col(k.n) || '#f4f5fb'}" stroke="#8890b0" stroke-width=".5"/>${k.n % 12 === 0 ? `<text x="${k.x + 2}" y="55" font-size="6" fill="#666">C${k.n / 12 - 1}</text>` : ''}`;
    for (const k of black) s += `<rect x="${k.x}" y="0" width="8" height="36" rx="1.5" fill="${col(k.n) || '#20243a'}"/>`;
    return s + '</svg>';
  }
  function guitarSVG(c) {
    const g = E.guitarShape(c); if (!g) return '<p class="hint">无合适的吉他指法</p>';
    const base = g.base, W = 140, H = 150, x0 = 25, y0 = 28, sw = 18, fh = 22;
    let s = `<svg viewBox="0 0 ${W + 20} ${H}" role="img" aria-label="吉他指法：${esc(c.name)}" style="max-width:200px;margin:auto">`;
    s += `<text x="${x0 + 45}" y="12" font-size="11" text-anchor="middle" fill="currentColor" font-weight="700">${esc(c.name)}</text>`;
    for (let i = 0; i < 6; i++) s += `<line x1="${x0 + i * sw}" y1="${y0}" x2="${x0 + i * sw}" y2="${y0 + fh * 5}" stroke="var(--muted)" stroke-width="1"/>`;
    for (let f = 0; f <= 5; f++) s += `<line x1="${x0}" y1="${y0 + f * fh}" x2="${x0 + sw * 5}" y2="${y0 + f * fh}" stroke="var(--muted)" stroke-width="${f === 0 && base === 1 ? 4 : 1}"/>`;
    if (base > 1) s += `<text x="${x0 - 6}" y="${y0 + fh * 0.65}" font-size="10" text-anchor="end" fill="var(--muted)">${base}fr</text>`;
    g.frets.forEach((f, i) => {
      const x = x0 + i * sw;
      if (f < 0) s += `<text x="${x}" y="${y0 - 6}" font-size="11" text-anchor="middle" fill="var(--muted)">×</text>`;
      else if (f === 0) s += `<circle cx="${x}" cy="${y0 - 10}" r="4" fill="none" stroke="var(--muted)"/>`;
      else { const rf = f - base + 1; s += `<circle cx="${x}" cy="${y0 + (rf - 0.5) * fh}" r="7" fill="${i === g.frets.findIndex((v) => v >= 0) ? 'var(--D)' : 'var(--acc)'}"/>`; }
    });
    return s + '</svg>';
  }
  const NN = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
  function noteName(c, n) { // 按和弦音的字母级数拼写（Db13 中写 Cb/Eb 而不是 B/D#）
    const pc = n % 12; let nm = NN[pc];
    if (c.xb && pc === c.xbPc) nm = c.xbName;
    else { const t = E.Q[c.q].t.find((x) => (c.pc + x[0]) % 12 === pc); if (t) nm = E.spell(pc, c.letter + t[1]); }
    return nm + (Math.floor(n / 12) - 1);
  }
  function renderInsp() {
    if (!song || sel < 0 || sel >= song.flat.length) { $('insp').innerHTML = '<h2>和弦详情</h2><div class="empty" style="padding:30px 0">点击任意和弦查看<br>键盘 / 吉他指法 / 可替换和弦</div>'; return; }
